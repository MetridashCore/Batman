name: ci

permissions: {}

on:
    push:
        branches:
            - develop
    pull_request:
        branches:
            - develop
    workflow_dispatch: {}
    merge_group: {}

jobs:
    ci:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node: [18, 20, 22]
        steps:
            - uses: actions/checkout@v4
            - run: corepack enable
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm

            - name: 📦 Install dependencies
              run: npm install

            - name: 📝 Lint
              run: npm run lint
